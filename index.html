<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Familiar VIP</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #eab308; --green: #22c55e; --red: #ef4444; --blue: #3b82f6; --text: #f8fafc; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; justify-content: center; }
        .caja { background: var(--card); padding: 20px; border-radius: 16px; width: 100%; max-width: 440px; border: 1px solid #334155; }
        h1, h3 { text-align: center; margin-top: 0; }
        h1 { color: var(--accent); }
        input, button { width: 100%; padding: 12px; margin: 6px 0; border-radius: 8px; border: none; font-size: 15px; }
        input { background: var(--bg); color: white; border: 1px solid #475569; }
        button { background: var(--accent); color: #000; font-weight: bold; cursor: pointer; }
        .verde { background: var(--green); color: white; }
        .azul { background: var(--blue); color: white; }
        .rojo { background: var(--red); color: white; }
        .gris { background: #475569; color: white; }
        .barra { display: flex; justify-content: space-between; align-items: center; background: var(--bg); padding: 12px 15px; border-radius: 10px; border: 1px solid var(--accent); margin-bottom: 12px; }
        .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 15px; }
        .tabs button { padding: 8px 4px; font-size: 13px; margin: 0; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
        .celda { aspect-ratio: 1; background: #334155; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 26px; cursor: pointer; }
        .slot-box { display: flex; justify-content: space-around; background: var(--bg); padding: 20px; border-radius: 12px; border: 2px solid var(--accent); font-size: 46px; margin: 15px 0; }
        .ranking-item { display: flex; justify-content: space-between; padding: 10px; background: var(--bg); margin: 5px 0; border-radius: 8px; border-left: 4px solid var(--accent); }
        .cajero-row { display: flex; justify-content: space-between; align-items: center; background: var(--bg); padding: 8px 10px; margin: 6px 0; border-radius: 8px; font-size: 14px; }
        .cajero-btns { display: flex; gap: 4px; }
        .cajero-btns button { width: auto; padding: 6px 8px; font-size: 12px; margin: 0; }
        .oculto { display: none !important; }
    </style>
</head>
<body>
    <div id="login" class="caja">
        <h1>🎰 CASINO FAMILIAR</h1>
        <p style="text-align:center; color:#94a3b8;">Ingresa tu nombre para unirte a la sala</p>
        <input type="text" id="nombre" placeholder="Ej: eze, Mamá, Tío Carlos...">
        <button type="button" id="btn-entrar">ENTRAR A LA SALA</button>
    </div>

    <div id="sala" class="caja oculto">
        <div class="barra">
            <span style="cursor:pointer; user-select:none;">👤 <b id="txt-user"></b></span>
            <span style="color:var(--green); font-size:18px;">🪙 <b id="txt-saldo">0</b></span>
        </div>
        <div class="tabs">
            <button type="button" id="t-slots">🍒 Slots</button>
            <button type="button" id="t-minas" class="gris">💣 Minas</button>
            <button type="button" id="t-dados" class="gris">🎲 Dados</button>
            <button type="button" id="t-rank" class="gris">🏆 Top</button>
        </div>
        <div id="v-slots">
            <h3>🍒 TRAGAMONEDAS VIP</h3>
            <p style="font-size:12px; text-align:center; color:#94a3b8;">2 iguales = x2 | 3 iguales = x5 | 3 Diamantes 💎 = x10</p>
            <div class="slot-box"><span id="r1">🍒</span><span id="r2">🍋</span><span id="r3">💎</span></div>
            <p id="slot-msg" style="text-align:center; font-weight:bold; min-height:20px;"></p>
            <input type="number" id="apuesta-slot" value="100" min="10">
            <button type="button" id="btn-girar" class="verde">🎰 GIRAR RODILLOS</button>
        </div>
        <div id="v-minas" class="oculto">
            <h3>💣 MINAS (4x4)</h3>
            <input type="number" id="apuesta-minas" value="100" min="10">
            <button type="button" id="btn-jugar-minas" class="verde">APOSTAR Y JUGAR</button>
            <button type="button" id="btn-retirar" class="verde oculto">RETIRAR: 🪙 <span id="txt-ganancia">0</span></button>
            <div class="grid" id="tablero"></div>
        </div>
        <div id="v-dados" class="oculto">
            <h3>🎲 DADOS (MAYOR O MENOR)</h3>
            <div id="dado-num" style="font-size:44px; font-weight:bold; padding:20px; background:var(--bg); border-radius:12px; margin:10px 0; text-align:center; color:var(--accent);">🎲 --</div>
            <p id="dado-msg" style="text-align:center; font-weight:bold; min-height:20px;"></p>
            <input type="number" id="apuesta-dados" value="100" min="10">
            <div style="display:flex; gap:8px;">
                <button type="button" id="btn-menor" class="azul">🔽 Menor a 50</button>
                <button type="button" id="btn-mayor" class="verde">🔼 Mayor a 50</button>
            </div>
        </div>
        <div id="v-rank" class="oculto">
            <h3>🏆 RANKING FAMILIAR EN VIVO</h3>
            <div id="lista-ranking">Cargando posiciones...</div>
        </div>
        <div id="box-cajero" class="oculto" style="margin-top:15px; border-top:1px dashed #475569; padding-top:10px;">
            <p style="font-size:13px; color:var(--accent); text-align:center;">Gestión de fichas:</p>
            <div id="lista-cajero"></div>
        </div>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
